name: HoloPhotos
options:
  bundleIdPrefix: com.holophotos
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
targets:
  HoloPhotos:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - ContentView.swift
      - HolophotoApp.swift
      - MainTabView.swift
      - PhotoLibrary.swift
      - ThumbnailView.swift
      - FullPhotoView.swift
      - ShareSheet.swift
      - SettingsView.swift
      - AIView.swift
      - OllamaClient.swift
      - QuotaStore.swift
      - CollectionsView.swift
      - PrivateVault.swift
      - TrashStore.swift
      - SpeechRecognizer.swift
      - AppLock.swift
      - Haptics.swift
      - Onboarding.swift
      - Folders.swift
      - LiveMedia.swift
      - Assets.xcassets
      - AuthStore.swift
      - AccountViews.swift
      - DriveConfig.swift
      - DriveAuth.swift
      - DriveClient.swift
      - BackupManager.swift
      - BackupView.swift
      - path: GoogleService-Info.plist
        optional: true
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: HoloPhotos-Info.plist
      properties:
        CFBundleDisplayName: HoloPhotos
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: "HoloPhotos a besoin d'accéder à ta galerie pour afficher et ranger tes photos et vidéos."
        NSPhotoLibraryAddUsageDescription: "HoloPhotos enregistre les copies et les nouveaux albums dans ta galerie."
        NSFaceIDUsageDescription: "HoloPhotos utilise Face ID pour ouvrir ton album privé."
        NSMicrophoneUsageDescription: "HoloPhotos utilise le micro pour dicter tes messages à l'IA."
        NSSpeechRecognitionUsageDescription: "HoloPhotos transforme ta voix en texte pour écrire à l'IA."
        NSLocalNetworkUsageDescription: "HoloPhotos se connecte à ton PC pour utiliser l'IA locale."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - "com.googleusercontent.apps.130682847333-tnmm6kliji31mcvspcitnu3ibhnulv98"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.holophotos.app
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
