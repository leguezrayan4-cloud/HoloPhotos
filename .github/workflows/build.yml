name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-16
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild -project HoloPhotos.xcodeproj -scheme HoloPhotos \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/HoloPhotos.app Payload/
          zip -r HoloPhotos.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HoloPhotos-ipa
          path: HoloPhotos.ipa
