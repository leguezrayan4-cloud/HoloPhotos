name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild -project Holophoto.xcodeproj -scheme Holophoto \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/Holophoto.app Payload/
          zip -r Holophoto.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Holophoto-ipa
          path: Holophoto.ipa
