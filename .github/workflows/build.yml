name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          set -o pipefail
          xcodebuild -project HoloPhotos.xcodeproj -scheme HoloPhotos \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | tail -n 5
      - if: failure()
        run: grep -E "error:" build.log | sort -u
      - run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/HoloPhotos.app Payload/
          zip -r HoloPhotos.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HoloPhotos-ipa
          path: HoloPhotos.ipa
